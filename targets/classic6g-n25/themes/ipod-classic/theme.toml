[theme]
id = "linnet.theme.ipod-classic"
name = "iPod Classic"
style = "apple-classic"
layout = "ipod-classic"
targets = ["classic6g-n25"]
font = "../../../../sdk/assets/font-sans14.json"
font_license = "../../../../sdk/assets/FONT-LICENSE.txt"

font_source = "apple-podium-sans16"

[colors]
foreground = "#151515"
background = "#ffffff"
accent = "#2f73cf"
muted = "#666666"
panel = "#d8d8d8"
selection_fg = "#ffffff"
selection_bg = "#2f73cf"
status_fg = "#111111"
status_bg = "#d8d8d8"
border = "#8f8f8f"
artwork_bg = "#e7e7e7"
artwork_fg = "#4f4f4f"
battery = "#70ad38"

[metrics]
row_height = 27
padding = 9

[assets]
music = "../../../../themes/default/music.ppm"
artwork = "../../../../themes/default/artwork.ppm"
